security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login_check$, roles: PUBLIC_ACCESS }
        # Ouverture temporaire pour la phase de développement métier PNER :
        # les référentiels, les modules projet, SIG, SSE et financement API Platform sont consultables sans JWT.
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/programme_pners, roles: PUBLIC_ACCESS }
        - { path: ^/api/zers, roles: PUBLIC_ACCESS }
        - { path: ^/api/prefectures, roles: PUBLIC_ACCESS }
        - { path: ^/api/sous_prefectures, roles: PUBLIC_ACCESS }
        - { path: ^/api/localites, roles: PUBLIC_ACCESS }
        - { path: ^/api/systeme_electrifications, roles: PUBLIC_ACCESS }
        - { path: ^/api/projet_electrifications, roles: PUBLIC_ACCESS }
        - { path: ^/api/projet_localites, roles: PUBLIC_ACCESS }
        - { path: ^/api/phase_projets, roles: PUBLIC_ACCESS }
        - { path: ^/api/activite_projets, roles: PUBLIC_ACCESS }
        - { path: ^/api/point_gps, roles: PUBLIC_ACCESS }
        - { path: ^/api/infrastructure_electriques, roles: PUBLIC_ACCESS }
        - { path: ^/api/site_energetiques, roles: PUBLIC_ACCESS }
        - { path: ^/api/donnee_geospatiale_localites, roles: PUBLIC_ACCESS }
        - { path: ^/api/indicateur_pners, roles: PUBLIC_ACCESS }
        - { path: ^/api/valeur_indicateurs, roles: PUBLIC_ACCESS }
        - { path: ^/api/rapport_suivis, roles: PUBLIC_ACCESS }
        - { path: ^/api/observation_suivis, roles: PUBLIC_ACCESS }
        - { path: ^/api/bailleur_fonds, roles: PUBLIC_ACCESS }
        - { path: ^/api/source_financements, roles: PUBLIC_ACCESS }
        - { path: ^/api/convention_financements, roles: PUBLIC_ACCESS }
        - { path: ^/api/decaissements, roles: PUBLIC_ACCESS }
        - { path: ^/api/cout_previsionnels, roles: PUBLIC_ACCESS }
        - { path: ^/api/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
