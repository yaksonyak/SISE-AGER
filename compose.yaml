services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sise_ager_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-ChangeMe!}@postgres:5432/${POSTGRES_DB:-sise_ager}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-ChangeThisJwtPassphrase}
      JWT_TOKEN_TTL: ${JWT_TOKEN_TTL:-3600}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sise-ager.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeAdmin123!}
      ADMIN_NOM: ${ADMIN_NOM:-Administrateur}
      ADMIN_PRENOM: ${ADMIN_PRENOM:-SISE-AGER}
      ADMIN_TELEPHONE: ${ADMIN_TELEPHONE:-}
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    networks:
      - sise_ager

  nginx:
    image: nginx:1.27-alpine
    container_name: sise_ager_nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sise_ager

  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: sise_ager_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sise_ager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-sise_ager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    networks:
      - sise_ager

volumes:
  postgres_data:

networks:
  sise_ager:
    driver: bridge
